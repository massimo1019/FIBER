[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fiber-fairness"
version = "0.1.0"
description = "FIBER fairness-sensitive attribute identification experiments with FairMask and MAAT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=1.5,<3",
    "scikit-learn>=1.2,<2",
    "imbalanced-learn>=0.10,<1",
]

[project.optional-dependencies]
dev = ["pytest>=7,<9"]

[tool.setuptools.packages.find]
where = ["src"]
